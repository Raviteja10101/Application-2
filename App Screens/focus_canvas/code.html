</button>

<script>
  (function() {
    let totalSeconds = 24 * 60 + 56;
    let isRunning = true;
    let intervalTimer = null;
    let zenModeActive = false;

    const countdownEl = document.getElementById('countdown');
    const pauseBtn = document.getElementById('pause-btn');
    const addTimeBtn = document.getElementById('add-time-btn');
    const zenToggle = document.getElementById('zen-toggle');
    const zenGlow = document.getElementById('zen-glow');
    const canvas = document.getElementById('focus-canvas');
    const progressCircle = document.getElementById('progress-circle');

    const totalCircumference = 804.2;
    const initialSessionLength = 30 * 60; // baseline 30 mins

    function updateDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      const ratio = Math.max(0, Math.min(1, totalSeconds / initialSessionLength));
      const offset = totalCircumference * (1 - ratio);
      progressCircle.style.strokeDashoffset = offset;
    }

    function tick() {
      if (totalSeconds > 0) {
        totalSeconds--;
        updateDisplay();
      } else {
        clearInterval(intervalTimer);
        isRunning = false;
        pauseBtn.innerHTML = `<span class="material-symbols-outlined text-[20px] text-secondary-fixed">replay</span><span class="font-title-lg text-title-lg tracking-wide font-medium">Complete</span>`;
      }
    }

    intervalTimer = setInterval(tick, 1000);

    pauseBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      if (isRunning) {
        intervalTimer = setInterval(tick, 1000);
        pauseBtn.innerHTML = `<span class="material-symbols-outlined text-[20px] text-secondary-fixed">pause</span><span class="font-title-lg text-title-lg tracking-wide font-medium">Pause</span>`;
        pauseBtn.classList.replace('bg-surface-container-high', 'bg-primary');
        pauseBtn.classList.replace('text-primary', 'text-on-primary');
      } else {
        clearInterval(intervalTimer);
        pauseBtn.innerHTML = `<span class="material-symbols-outlined text-[20px] text-secondary">play_arrow</span><span class="font-title-lg text-title-lg tracking-wide font-medium">Resume</span>`;
        pauseBtn.classList.replace('bg-primary', 'bg-surface-container-high');
        pauseBtn.classList.replace('text-on-primary', 'text-primary');
      }
    });

    addTimeBtn.addEventListener('click', () => {
      totalSeconds += 5 * 60;
      updateDisplay();
      addTimeBtn.classList.add('scale-90');
      setTimeout(() => addTimeBtn.classList.remove('scale-90'), 150);
    });

    function toggleZen() {
      zenModeActive = !zenModeActive;
      if (zenModeActive) {
        zenGlow.classList.replace('w-72', 'w-96');
        zenGlow.classList.replace('h-72', 'h-96');
        zenGlow.classList.replace('bg-secondary-fixed/25', 'bg-secondary-container/40');
      } else {
        zenGlow.classList.replace('w-96', 'w-72');
        zenGlow.classList.replace('h-96', 'h-72');
        zenGlow.classList.replace('bg-secondary-container/40', 'bg-secondary-fixed/25');
      }
    }

    zenToggle.addEventListener('click', toggleZen);

    let pressTimer;
    canvas.addEventListener('touchstart', (e) => {
      if (e.target.closest('button')) return;
      pressTimer = setTimeout(toggleZen, 600);
    });
    canvas.addEventListener('touchend', () => clearTimeout(pressTimer));
    canvas.addEventListener('mousedown', (e) => {
      if (e.target.closest('button')) return;
      pressTimer = setTimeout(toggleZen, 600);
    });
    canvas.addEventListener('mouseup', () => clearTimeout(pressTimer));

    updateDisplay();
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(45,42,38,0.04)]" data-active-classes="text-secondary bg-surface-container-low"><div class="flex justify-around items-center h-16 px-gutter-mobile"><a class="flex flex-col items-center justify-center min-w-[64px] h-12 rounded-lg text-on-surface-variant hover:text-primary transition-colors" data-path="ledger" href="#"><span class="material-symbols-outlined text-[22px]">menu_book</span><span class="font-label-sm text-label-sm tracking-wide mt-0.5">Ledger</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[64px] h-12 rounded-lg transition-colors text-secondary bg-surface-container-low" data-path="focus" href="#"><span class="material-symbols-outlined text-[22px]">explore</span><span class="font-label-sm text-label-sm tracking-wide mt-0.5">Focus</span></a><a class="flex flex-col items-center justify-center min-w-[64px] h-12 rounded-lg text-on-surface-variant hover:text-primary transition-colors" data-path="session-diary" href="#"><span class="material-symbols-outlined text-[22px]">history_edu</span><span class="font-label-sm text-label-sm tracking-wide mt-0.5">Session Diary</span></a></div></nav></body></html>
